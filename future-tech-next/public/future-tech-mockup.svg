    <text x="330" y="570" fill="#64748b" font-family="Arial, sans-serif" font-size="18">Des expériences digitales pensées pour durer.</text>
    <rect x="860" y="390" width="190" height="190" rx="28" fill="#dbeafe"/>
    <path d="M920 490l30-75 30 75-30 75z" fill="#1d4ed8" opacity="0.85"/>
    <rect x="330" y="646" width="150" height="30" rx="9" fill="#1d4ed8"/>
