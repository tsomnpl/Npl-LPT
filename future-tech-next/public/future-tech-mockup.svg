<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Mockup responsive Future-Tech</title>
  <desc id="desc">Présentation de Future-Tech sur ordinateur portable, tablette et smartphone.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#eff6ff"/>
      <stop offset="0.55" stop-color="#dbeafe"/>
      <stop offset="1" stop-color="#bfdbfe"/>
    </linearGradient>
    <linearGradient id="screen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#f8fafc"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="180%">
      <feDropShadow dx="0" dy="24" stdDeviation="22" flood-color="#1e3a8a" flood-opacity="0.2"/>
    </filter>
  </defs>

  <rect width="1600" height="900" rx="36" fill="url(#background)"/>
  <circle cx="1380" cy="120" r="190" fill="#ffffff" opacity="0.38"/>
  <circle cx="170" cy="770" r="220" fill="#93c5fd" opacity="0.25"/>
  <text x="96" y="128" fill="#1e3a8a" font-family="Arial, sans-serif" font-size="30" font-weight="700" letter-spacing="4">FUTURE-TECH</text>
  <text x="96" y="174" fill="#1d4ed8" font-family="Arial, sans-serif" font-size="20">Solutions numériques modernes et performantes</text>

  <g filter="url(#shadow)">
    <rect x="260" y="250" width="870" height="500" rx="22" fill="#172554"/>
    <rect x="282" y="272" width="826" height="456" rx="10" fill="url(#screen)"/>
    <rect x="282" y="272" width="826" height="62" rx="10" fill="#ffffff"/>
    <circle cx="314" cy="303" r="7" fill="#bfdbfe"/>
    <text x="344" y="312" fill="#1d4ed8" font-family="Arial, sans-serif" font-size="22" font-weight="700">Future-Tech</text>
    <text x="832" y="310" fill="#475569" font-family="Arial, sans-serif" font-size="15">À propos</text>
    <text x="930" y="310" fill="#475569" font-family="Arial, sans-serif" font-size="15">Projets</text>
    <rect x="1000" y="292" width="82" height="28" rx="8" fill="#1d4ed8"/>
    <text x="1017" y="311" fill="#ffffff" font-family="Arial, sans-serif" font-size="12" font-weight="700">Contact</text>
    <rect x="330" y="385" width="300" height="28" rx="8" fill="#dbeafe"/>
    <rect x="330" y="430" width="470" height="58" rx="8" fill="#1d4ed8"/>
